<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipPilot</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mute:#9aa3b2; --accent:#6ea8fe; --ok:#4ade80; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { margin:0 0 4px; font-size:22px; } .sub { color:var(--mute); margin:0 0 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  button { background:var(--accent); color:#0b1220; border:0; border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  input[type=file] { color:var(--mute); }
  #steps { list-style:none; padding:0; margin:12px 0 0; } #steps li { color:var(--mute); padding:2px 0; }
  #steps li.last { color:var(--text); } #steps li.failed { color:var(--bad); }
  #result { display:none; margin-top:20px; grid-template-columns:minmax(0,2fr) minmax(0,1fr); gap:16px; }
  @media (max-width:800px) { #result { grid-template-columns:1fr; } }
  .stage { position:relative; } video { width:100%; border-radius:10px; background:#000; display:block; }
  #quiz { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,10,14,.88); border-radius:10px; padding:16px; }
  #quiz .box { max-width:520px; width:100%; } #quiz h3 { margin:0 0 12px; }
  #quiz .opt { display:block; width:100%; text-align:left; margin:6px 0; background:var(--panel); color:var(--text); border:1px solid var(--line); }
  #quiz .opt.right { border-color:var(--ok); } #quiz .opt.wrong { border-color:var(--bad); }
  #quiz p { color:var(--mute); }
  h2 { font-size:15px; margin:0 0 8px; } ul.list { list-style:none; margin:0 0 16px; padding:0; }
  ul.list li { padding:6px 0; border-bottom:1px solid var(--line); } ul.list li:last-child { border-bottom:0; }
  .t { color:var(--accent); font-variant-numeric:tabular-nums; cursor:pointer; background:none; border:0; padding:0; font-weight:600; }
  .small { color:var(--mute); font-size:13px; } a { color:var(--accent); }
  #meta { margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>ClipPilot</h1>
  <p class="sub">Upload a video. Get HLS streaming, AI chapters, an in-video quiz and auto-cut highlight clips.</p>

  <div class="panel">
    <form id="form"><input id="file" type="file" accept="video/*" required> <button id="go" type="submit">Analyse</button></form>
    <ul id="steps"></ul>
  </div>

  <div id="result">
    <div>
      <div class="stage"><video id="video" controls playsinline></video><div id="quiz"><div class="box"></div></div></div>
      <div id="meta" class="small"></div>
    </div>
    <div class="panel">
      <h2>Summary</h2><p id="summary" class="small"></p>
      <h2>Chapters</h2><ul class="list" id="chapters"></ul>
      <h2>Highlight clips</h2><ul class="list" id="clips"></ul>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
};
const video = $("video");

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $("file").files[0];
  if (!file) return;
  $("go").disabled = true;
  $("steps").replaceChildren();
  $("result").style.display = "none";
  const body = new FormData();
  body.append("video", file);
  const res = await fetch("/api/videos", { method: "POST", body });
  const json = await res.json();
  if (!res.ok) return fail(json.error ?? "Upload failed");
  follow(json.id);
});

function fail(message) {
  $("steps").append(el("li", { className: "failed", textContent: message }));
  $("go").disabled = false;
}

function follow(id) {
  const source = new EventSource(`/api/videos/${id}/events`);
  source.onmessage = async (msg) => {
    const ev = JSON.parse(msg.data);
    $("steps").querySelectorAll("li.last").forEach((li) => li.classList.remove("last"));
    $("steps").append(el("li", { className: ev.stage === "failed" ? "failed" : "last", textContent: ev.message }));
    if (ev.stage === "done") {
      source.close();
      show(await (await fetch(`/api/videos/${id}`)).json());
      $("go").disabled = false;
    } else if (ev.stage === "failed") {
      source.close();
      $("go").disabled = false;
    }
  };
  source.onerror = () => source.close();
}

let asked = new Set();
function show(job) {
  const r = job.result;
  $("result").style.display = "grid";
  asked = new Set();
  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(r.hlsUrl);
    hls.attachMedia(video);
  } else {
    video.src = r.hlsUrl; // Safari plays HLS natively
  }
  $("summary").textContent = r.analysis.summary;
  $("chapters").replaceChildren(...r.analysis.chapters.map((c) =>
    el("li", {}, el("button", { className: "t", textContent: fmt(c.start), onclick: () => { video.currentTime = c.start; video.play(); } }),
      " ", el("strong", { textContent: c.title }), el("div", { className: "small", textContent: c.summary }))));
  $("clips").replaceChildren(...r.clips.map((c) =>
    el("li", {}, el("a", { href: c.url, textContent: c.title }), el("span", { className: "small", textContent: `  ${fmt(c.start)}–${fmt(c.end)}` }))));
  const notes = [`${r.analysis.quiz.length} quiz questions`, `${r.clips.length} clips`];
  if (r.analysisAttempts > 1) notes.push(`model answer rejected ${r.analysisAttempts - 1}x before it validated`);
  if (r.rejectedToolCalls.length) notes.push(`${r.rejectedToolCalls.length} tool call(s) rejected`);
  $("meta").textContent = notes.join(" · ");
  window.currentQuiz = r.analysis.quiz;
}

video.addEventListener("timeupdate", () => {
  const quiz = window.currentQuiz ?? [];
  const q = quiz.find((x, i) => !asked.has(i) && video.currentTime >= x.at && video.currentTime < x.at + 1.5);
  if (!q) return;
  asked.add(quiz.indexOf(q));
  video.pause();
  const box = $("quiz").firstElementChild;
  const note = el("p", { textContent: "" });
  box.replaceChildren(el("h3", { textContent: q.question }));
  q.options.forEach((text, i) => {
    const b = el("button", { className: "opt", textContent: text });
    b.onclick = () => {
      box.querySelectorAll(".opt").forEach((o, j) => { o.disabled = true; if (j === q.answerIndex) o.classList.add("right"); });
      if (i !== q.answerIndex) b.classList.add("wrong");
      note.textContent = q.explanation;
      box.append(el("button", { className: "ghost", textContent: "Continue", onclick: () => { $("quiz").style.display = "none"; video.play(); } }));
    };
    box.append(b);
  });
  box.append(note);
  $("quiz").style.display = "flex";
});

video.addEventListener("seeking", () => { asked = new Set([...asked].filter((i) => (window.currentQuiz[i]?.at ?? 0) < video.currentTime - 1.5)); });
</script>
</body>
</html>
